apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-target
  labels:
    app: api-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-target
  template:
    metadata:
      labels:
        app: api-target
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api-target
        image: alexat/tcc-api-target:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-target-service
spec:
  type: NodePort
  selector:
    app: api-target
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
