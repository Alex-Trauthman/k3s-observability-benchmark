apiVersion: v1
kind: ConfigMap
metadata:
  name: netdata-config
data:
  prometheus.conf: |
    jobs:
      - name: api_target
        url: http://api-target-service:8080/metrics
        update_every: 10

  api_target.conf: |
    alarm: HighLatencyP95
       on: prometheus_api_target.http_request_duration_seconds-path=/work-status=200_sum
    lookup: average -20s unaligned
    every: 5s
     crit: $this > 10

    alarm: HighErrorRate
       on: prometheus_api_target.http_requests_total-path=/work-status=500
    lookup: average -20s unaligned
    every: 5s
     crit: $this > 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-c-netdata
  labels:
    app: pipeline-c-netdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-c-netdata
  template:
    metadata:
      labels:
        app: pipeline-c-netdata
    spec:
      containers:
      - name: netdata
        image: netdata/netdata:v1.45.3
        ports:
        - containerPort: 19999
          name: http
        env:
        - name: DO_NOT_TRACK
          value: "1"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "400m"
            memory: "384Mi"
        volumeMounts:
        - name: netdata-prometheus-conf
          mountPath: /etc/netdata/go.d/prometheus.conf
          subPath: prometheus.conf
        - name: netdata-health-conf
          mountPath: /etc/netdata/health.d/api_target.conf
          subPath: api_target.conf
      volumes:
      - name: netdata-prometheus-conf
        configMap:
          name: netdata-config
      - name: netdata-health-conf
        configMap:
          name: netdata-config
---
apiVersion: v1
kind: Service
metadata:
  name: netdata-service
spec:
  type: NodePort
  selector:
    app: pipeline-c-netdata
  ports:
    - name: web
      protocol: TCP
      port: 19999
      targetPort: 19999
      nodePort: 30095
