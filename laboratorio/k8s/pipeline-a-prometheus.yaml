apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['localhost:9093']

    scrape_configs:
      - job_name: 'api-target'
        static_configs:
          - targets: ['api-target-service:8080']

  alert_rules.yml: |
    groups:
      - name: anomalies
        rules:
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.20
            for: 15s
            labels:
              severity: critical
            annotations:
              summary: "Latencia p95 acima de 200ms detectada na borda"
          - alert: HighErrorRate
            expr: sum(rate(http_requests_total{status="500"}[1m])) / sum(rate(http_requests_total[1m])) > 0.10
            for: 15s
            labels:
              severity: critical
            annotations:
              summary: "Taxa de erro HTTP 500 acima de 10% detectada na borda"

  alertmanager.yml: |
    global:
      resolve_timeout: 1m
    route:
      receiver: 'blackhole'
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 1h
    receivers:
      - name: 'blackhole'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-a-prometheus
  labels:
    app: pipeline-a-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-a-prometheus
  template:
    metadata:
      labels:
        app: pipeline-a-prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--storage.tsdb.retention.time=2h"
          - "--web.enable-lifecycle"
        ports:
        - containerPort: 9090
          name: web
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "400m"
            memory: "384Mi"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
        - name: rules-volume
          mountPath: /etc/prometheus/rules
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
          - "--config.file=/etc/alertmanager/alertmanager.yml"
          - "--storage.path=/alertmanager"
        ports:
        - containerPort: 9093
          name: alert
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
        - name: alertmanager-config-volume
          mountPath: /etc/alertmanager
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
          items:
            - key: prometheus.yml
              path: prometheus.yml
      - name: rules-volume
        configMap:
          name: prometheus-config
          items:
            - key: alert_rules.yml
              path: alert_rules.yml
      - name: alertmanager-config-volume
        configMap:
          name: prometheus-config
          items:
            - key: alertmanager.yml
              path: alertmanager.yml
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  type: NodePort
  selector:
    app: pipeline-a-prometheus
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30090
    name: web
  - port: 9093
    targetPort: 9093
    nodePort: 30093
    name: alert
