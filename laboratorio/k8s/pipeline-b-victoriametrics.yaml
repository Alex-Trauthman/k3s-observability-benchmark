apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-config
data:
  vmagent.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'api-target'
        static_configs:
          - targets: ['api-target-service:8080']

  alerts.yml: |
    groups:
      - name: anomalies
        rules:
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.20
            for: 15s
            labels:
              severity: critical
            annotations:
              summary: "Latencia p95 acima de 200ms detectada na borda"
          - alert: HighErrorRate
            expr: sum(rate(http_requests_total{status="500"}[1m])) / sum(rate(http_requests_total[1m])) > 0.10
            for: 15s
            labels:
              severity: critical
            annotations:
              summary: "Taxa de erro HTTP 500 acima de 10% detectada na borda"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-b-victoriametrics
  labels:
    app: pipeline-b-victoriametrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-b-victoriametrics
  template:
    metadata:
      labels:
        app: pipeline-b-victoriametrics
    spec:
      containers:
      - name: victoria-metrics
        image: victoriametrics/victoria-metrics:v1.99.0
        args:
          - "-storageDataPath=/vmetrics-data"
          - "-retentionPeriod=1d"
          - "-memory.allowedPercent=60"
        ports:
        - containerPort: 8428
          name: http
        resources:
          requests:
            cpu: "30m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "192Mi"
      - name: vmagent
        image: victoriametrics/vmagent:v1.99.0
        args:
          - "-promscrape.config=/etc/vmagent/vmagent.yml"
          - "-remoteWrite.url=http://localhost:8428/api/v1/write"
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
        - name: vmagent-config
          mountPath: /etc/vmagent
      - name: vmalert
        image: victoriametrics/vmalert:v1.99.0
        args:
          - "-rule=/etc/vmalert/alerts.yml"
          - "-datasource.url=http://localhost:8428"
          - "-evaluationInterval=15s"
          - "-notifier.blackhole"
        ports:
        - containerPort: 8880
          name: alert
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
        - name: vmalert-config
          mountPath: /etc/vmalert
      volumes:
      - name: vmagent-config
        configMap:
          name: victoriametrics-config
          items:
            - key: vmagent.yml
              path: vmagent.yml
      - name: vmalert-config
        configMap:
          name: victoriametrics-config
          items:
            - key: alerts.yml
              path: alerts.yml
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics-service
spec:
  type: NodePort
  selector:
    app: pipeline-b-victoriametrics
  ports:
  - port: 8428
    targetPort: 8428
    nodePort: 30091
    name: http
  - port: 8880
    targetPort: 8880
    nodePort: 30094
    name: alert
